[tool.poetry]
name = "mac-results"
version = "0.1.0"
description = "Results Preparation for MAC."
authors = ["Jeff Rye <mnautox.com@ryeworx.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
numpy = ">=2.0.0,<3"
pandas = ">=2.2.0,<3"
pystache = "^0.6.0"
xlrd = "^2.0.1"
openpyxl = "^3.0.10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
